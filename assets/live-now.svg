<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 212" width="1200" height="212" role="img" aria-label="Live status">
<title>Live status</title>
<defs>
<pattern id="lnScan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="4" fill="none"/>
  <rect y="0" width="4" height="1.15" fill="#000" opacity="0.55"/>
</pattern>
<filter id="lnGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feFlood flood-color="#00ff41" flood-opacity="0.9" result="c"/>
  <feComposite in="c" in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<linearGradient id="lnEdge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#1f6b3d" stop-opacity="0.2"/>
<stop offset="0.5" stop-color="#1d6b41" stop-opacity="0.9"/>
<stop offset="1" stop-color="#1f6b3d" stop-opacity="0.2"/>
</linearGradient>

<linearGradient id="lnPanel" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#04150c" stop-opacity="1"/>
<stop offset="1" stop-color="#020a06" stop-opacity="1"/>
</linearGradient>

<linearGradient id="lnBadge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#00ff41" stop-opacity="0.16"/>
<stop offset="1" stop-color="#00ff41" stop-opacity="0.04"/>
</linearGradient></defs>

<rect width="1200" height="212" fill="#000000"/>
<rect x="20" y="14" width="1160" height="184" rx="14" fill="url(#lnPanel)" stroke="url(#lnEdge)" stroke-width="1.4"/>
<rect x="20" y="14" width="1160" height="184" rx="14" fill="url(#lnScan)" opacity="0.3"/>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" values="0;1"/>
  <rect x="48" y="32" width="104" height="26" rx="13" fill="url(#lnBadge)" stroke="#00ff41" stroke-width="1.1"/>
  <text x="100" y="49" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#00ff41" text-anchor="middle" font-weight="700">ONLINE</text>
  <circle cx="140" cy="45" r="5" fill="#00ff41" filter="url(#lnGlow)"><animate attributeName="r" values="5;7.5;5" dur="1.7s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite" /></circle>
</g>
