<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="ID plate">
<title>ID plate</title>
<defs>
<filter id="idGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="8" result="b"/>
  <feFlood flood-color="#00ff41" flood-opacity="0.9" result="c"/>
  <feComposite in="c" in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="idScan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="4" fill="none"/>
  <rect y="0" width="4" height="1.15" fill="#000" opacity="0.55"/>
</pattern>

<linearGradient id="idEdge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#00ff41" stop-opacity="1"/>
<stop offset="0.5" stop-color="#1f6b3d" stop-opacity="0.5"/>
<stop offset="1" stop-color="#7dffb0" stop-opacity="1"/>
</linearGradient></defs>

<rect width="300" height="300" fill="#000000"/>
<g>
  <animateTransform attributeName="transform" type="rotate" values="0;360" dur="40s" repeatCount="indefinite" />
  <polygon points="272.98,79 272.98,221 150,292 27.02,221 27.02,79 150,8" fill="none" stroke="#1f6b3d" stroke-width="1" stroke-dasharray="4 10" transform="translate(150 150) scale(0.5) translate(-150 -150)"/>
</g>
<g transform="translate(150 150) scale(0.5) translate(-150 -150)">
  <g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="26s" repeatCount="indefinite" />
    <polygon points="267.78,82 267.78,218 150,286 32.22,218 32.22,82 150,14" fill="none" stroke="#12512c" stroke-width="1.6" stroke-dasharray="2 7"/>
  </g>
</g>
<polygon points="264.32,84 264.32,216 150,282 35.68,216 35.68,84 150,18" fill="#03110a" stroke="url(#idEdge)" stroke-width="2"/>
<polygon points="253.92,90 253.92,210 150,270 46.08,210 46.08,90 150,30" fill="none" stroke="#12512c" stroke-width="1"/>
<g filter="url(#idGlow)" opacity="0.95">
  <text x="150" y="168" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="64" fill="#00ff41" text-anchor="middle" font-weight="700" textLength="96" lengthAdjust="spacingAndGlyphs">HV</text>
</g>
<text x="150" y="208" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#7dffb0" text-anchor="middle" textLength="70.2" lengthAdjust="spacingAndGlyphs">Hadi Vaez</text>
<text x="150" y="230" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#1f6b3d" text-anchor="middle" textLength="112.2" lengthAdjust="spacingAndGlyphs">FLUTTER DEVELOPER</text>
<g><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite" /><circle cx="150" cy="52" r="3.6" fill="#00ff41"/></g>
<text x="150" y="34" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#12512c" text-anchor="middle">VERIFIED HUMAN ▸ DEV</text>
<rect width="300" height="300" fill="url(#idScan)" opacity="0.3"/>
</svg>