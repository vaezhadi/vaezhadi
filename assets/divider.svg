<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 26" width="1200" height="26" role="img" aria-label="">
<title></title>
<defs>
<linearGradient id="dvLine" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset="0.5" stop-color="#1f2a24" stop-opacity="1"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
</linearGradient>

<linearGradient id="dvShim" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#e6edf3" stop-opacity="0"/><stop offset="0.5" stop-color="#3fb950" stop-opacity="0.7"/><stop offset="1" stop-color="#e6edf3" stop-opacity="0"/>
</linearGradient></defs>

<rect width="1200" height="26" fill="#000000"/>
<rect x="60" y="13" width="1080" height="1" fill="url(#dvLine)"/>

