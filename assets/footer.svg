<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 156" width="1200" height="156" role="img" aria-label="Let’s build something.">
<title>Let’s build something.</title>
<defs>
<linearGradient id="ftRule" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset="0.5" stop-color="#1f2a24" stop-opacity="1"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
</linearGradient></defs>

<rect width="1200" height="156" fill="#000000"/>
<rect x="60" y="26" width="1080" height="1" fill="url(#ftRule)"/>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.2s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0 10;0 0"/>
  <text x="600" y="80" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#e6edf3" text-anchor="middle" font-weight="600" letter-spacing="0.5">Let’s build something.</text>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/>
  <text x="600" y="114" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">@vaezhadi</text>
</g>

<circle cx="547.55" cy="109.5" r="4" fill="#3fb950">
  <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" />
</circle>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/>
  <text x="600" y="142" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6e7681" text-anchor="middle">Raccoon City</text>
</g>
</svg>