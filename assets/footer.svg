<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 186" width="1200" height="186" role="img" aria-label="call to action">
<title>call to action</title>
<defs>
<filter id="ftGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="7" result="b"/>
  <feFlood flood-color="#00ff41" flood-opacity="0.9" result="c"/>
  <feComposite in="c" in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="ftScan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="4" fill="none"/>
  <rect y="0" width="4" height="1.15" fill="#000" opacity="0.55"/>
</pattern>

<linearGradient id="ftRule" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
<stop offset="0.5" stop-color="#7dffb0" stop-opacity="0.9"/>
<stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
</linearGradient>

<linearGradient id="ftPill" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#04160d" stop-opacity="1"/>
<stop offset="1" stop-color="#031009" stop-opacity="1"/>
</linearGradient></defs>

<rect width="1200" height="186" fill="#000000"/>
<rect width="1200" height="186" fill="url(#ftScan)" opacity="0.28"/>
<path d="M0 0 H1200" stroke="url(#ftRule)" stroke-width="1"/>
<text x="600" y="76" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="34" fill="#7dffb0" text-anchor="middle" font-weight="700" textLength="628.32" lengthAdjust="spacingAndGlyphs" opacity="0" <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" values="0;1"/>>GOT AN IDEA? LET'S BUILD IT.</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" values="0;1"/>
  <rect x="450" y="100" width="300" height="42" rx="21" fill="url(#ftPill)" stroke="#00ff41" stroke-width="1.4"/>
  <text x="600" y="127" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#00ff41" text-anchor="middle">▸  send a signal  ◂</text>
  <g><animateTransform attributeName="transform" type="translate" values="-6 0; 6 0; -6 0" dur="2.6s" repeatCount="indefinite" /><text x="428" y="127" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#1f6b3d" text-anchor="end">&gt;&gt;</text></g>
  <g><animateTransform attributeName="transform" type="translate" values="6 0; -6 0; 6 0" dur="2.6s" repeatCount="indefinite" /><text x="772" y="127" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#1f6b3d" text-anchor="start">&lt;&lt;</text></g>
</g>
<text x="40" y="168" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#12512c" text-anchor="start" opacity="0" <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" values="0;1"/>>// EOF — thanks for scrolling to the bottom</text>
<text x="1160" y="168" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#12512c" text-anchor="end" opacity="0" <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" values="0;1"/>>vaezhadi · 2026</text>
</svg>