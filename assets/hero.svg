<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 258" width="1200" height="258" role="img" aria-label="Hadi Vaez — Flutter Developer">
<title>Hadi Vaez — Flutter Developer</title>
<defs>

<radialGradient id="heroGlow" cx="50%" cy="50%" r="70%">
<stop offset="0" stop-color="#3fb950" stop-opacity="0.08"/><stop offset="0.55" stop-color="#3fb950" stop-opacity="0.025"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
</radialGradient>

<linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset="0.5" stop-color="#3fb950" stop-opacity="0.55"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
</linearGradient>

<linearGradient id="shim" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#e6edf3" stop-opacity="0"/><stop offset="0.5" stop-color="#56d364" stop-opacity="0.9"/><stop offset="1" stop-color="#e6edf3" stop-opacity="0"/>
</linearGradient></defs>

<rect width="1200" height="258" fill="#000000"/>
<ellipse cx="600" cy="26" rx="620" ry="196" fill="url(#heroGlow)">
  <animate attributeName="opacity" values="0.75;1;0.75" dur="11s" repeatCount="indefinite" />
</ellipse>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.15s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0 14;0 0"/>
  <text x="600" y="122" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" fill="#e6edf3" text-anchor="middle" font-weight="600" letter-spacing="6">Hadi Vaez</text>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/>
  <text x="600" y="164" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="500" letter-spacing="5">FLUTTER DEVELOPER</text>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/>
  <rect x="450" y="190" width="0" height="1.5" rx="0.75" fill="url(#line)" <animate attributeName="width" from="0" to="300" begin="0.8s" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.2 1" values="0;300"/>/>
</g>

<g opacity="0">
  <animate attributeName="opacity" values="0;0;0.5;0.5;0;0" keyTimes="0;0.25;0.4;0.6;0.75;1" dur="9s" begin="2.6s" repeatCount="indefinite"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-110 0; 300 0" dur="9s" begin="2.6s" repeatCount="indefinite"/>
    <rect x="450" y="190" width="110" height="1.5" rx="0.75" fill="url(#shim)"/>
  </g>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.6 0.2 1" values="0;1"/>
  <text x="600" y="224" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">I build apps that feel alive.</text>
</g>
</svg>